<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Runbox — Run in a box.">
  <defs>
    <linearGradient id="banner-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.55" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="banner-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="banner-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="banner-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#334155" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" rx="28" fill="url(#banner-bg)"/>
  <rect width="1280" height="320" rx="28" fill="url(#banner-dots)"/>
  <circle cx="180" cy="164" r="200" fill="url(#banner-glow)"/>
  <rect x="0" y="0" width="1280" height="5" rx="2.5" fill="url(#banner-accent)" opacity="0.85"/>

  <g transform="translate(88,88)">
    <rect width="144" height="144" rx="34" fill="#0B1220" stroke="#1E293B" stroke-width="2"/>
    <rect x="30" y="30" width="84" height="84" rx="18" fill="none" stroke="url(#banner-accent)" stroke-width="7"/>
    <path d="M53 62 L64 72 L53 82" fill="none" stroke="#F8FAFC" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M74 82 H94" fill="none" stroke="#F8FAFC" stroke-width="6" stroke-linecap="round"/>
  </g>

  <text x="280" y="166" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="8" fill="#F8FAFC">RUNBOX</text>
  <text x="284" y="218" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="#34D399">Run in a box.</text>
  <text x="284" y="256" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" fill="#94A3B8">One container. Many identities. Files included.</text>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="2" fill="#CBD5E1">
    <rect x="930" y="104" width="260" height="42" rx="21" fill="#0F172A" stroke="#1E293B"/>
    <text x="1060" y="131" text-anchor="middle">ONE BINARY</text>
    <rect x="930" y="158" width="260" height="42" rx="21" fill="#0F172A" stroke="#1E293B"/>
    <text x="1060" y="185" text-anchor="middle">ONE CONTAINER</text>
    <rect x="930" y="212" width="260" height="42" rx="21" fill="#0F172A" stroke="#1E293B"/>
    <text x="1060" y="239" text-anchor="middle">ONE VOLUME</text>
  </g>
</svg>
