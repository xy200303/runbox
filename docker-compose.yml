services:
  runbox:
    build:
      context: .
      target: full
      args:
        VERSION: ${VERSION:-dev}
        # Build-time mirrors (runtime commands already default to the
        # Tsinghua PyPI mirror and npmmirror for npm):
        # GOPROXY: https://goproxy.cn,direct
        # APT_MIRROR: mirrors.aliyun.com
        # PIP_MIRROR: https://pypi.tuna.tsinghua.edu.cn/simple
        # NPM_MIRROR: https://registry.npmmirror.com
    image: runbox:dev
    container_name: runbox
    environment:
      RUNBOX_ADDR: ":8099"
      RUNBOX_ROOT: /workspace
      RUNBOX_API_KEY: ${RUNBOX_API_KEY:?set RUNBOX_API_KEY in .env}
      RUNBOX_MAX_CONCURRENCY: ${RUNBOX_MAX_CONCURRENCY:-2}
      RUNBOX_LOG_FORMAT: ${RUNBOX_LOG_FORMAT:-text}
      # Prefer a reverse proxy for TLS. To terminate TLS here instead, mount
      # certificates and set RUNBOX_TLS_CERT / RUNBOX_TLS_KEY.
    ports:
      - "${RUNBOX_PORT:-8099}:8099"
    read_only: true
    tmpfs:
      # LibreOffice and package managers need an executable /tmp. Everything
      # else in the image is read-only.
      - /tmp:rw,exec,nosuid,size=1g
    volumes:
      - runbox-workspace:/workspace
    cap_drop: [ALL]
    cap_add:
      # Required to chown a workspace and switch to the per-identity UID.
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      # Required so a timeout can kill a command running as another UID.
      - KILL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8099/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  runbox-workspace:
