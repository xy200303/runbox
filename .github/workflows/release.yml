name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Release notes come from CHANGELOG.md so the tag page and the repository
      # never disagree. Fall back to the Unreleased section, then to generated
      # notes, so a tag without a changelog entry still produces a release.
      - name: extract release notes
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          notes="${RUNNER_TEMP}/release-notes.md"
          awk -v v="$version" '
            $0 ~ "^##[[:space:]]+" v "([^0-9.]|$)" { inside = 1; print "## " v; next }
            inside && /^##[[:space:]]/ { exit }
            inside { print }
          ' CHANGELOG.md > "$notes"
          if [ ! -s "$notes" ]; then
            awk -v t="$TAG" '
              /^##[[:space:]]+Unreleased/ { inside = 1; print "## " t; next }
              inside && /^##[[:space:]]/ { exit }
              inside { print }
            ' CHANGELOG.md > "$notes"
          fi
          if [ -s "$notes" ]; then
            printf '\n[Full changelog](https://github.com/%s/blob/main/CHANGELOG.md)\n' \
              "$GITHUB_REPOSITORY" >> "$notes"
            echo "file=$notes" >> "$GITHUB_OUTPUT"
            sed -n '1,20p' "$notes"
          else
            echo "no changelog section for ${TAG}" >&2
          fi

      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ steps.notes.outputs.file }}
        run: |
          if [ -n "$NOTES" ] && [ -s "$NOTES" ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes
          fi

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade build
          python -m build
      - name: publish to PyPI
        if: env.PYPI_API_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: sdk/python/dist
          skip_existing: true

  node:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdk/node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm test
      - name: publish to npm
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "runbox-sdk@$version" version >/dev/null 2>&1; then
            echo "runbox-sdk@$version is already published"
            exit 0
          fi
          out=$(npm publish --access public 2>&1) && { echo "$out"; exit 0; }
          echo "$out"
          if echo "$out" | grep -q "previously staged version"; then
            echo "::warning::runbox-sdk@$version is staged and awaits approval: npm stage approve <stage-id> --otp <code>"
            exit 0
          fi
          exit 1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
